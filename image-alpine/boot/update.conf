# SOS-GUIDE — Mise à jour OTA « pull » (signée). Fichier éditable ici, sur la
# racine de la carte (partition SOSBOOT), SANS recompiler ni reflasher.
#
# Quand c'est activé, la borne vérifie périodiquement (cron, ~30 min) s'il existe
# une version plus récente, SIGNÉE, à l'URL ci-dessous (joignable via Ethernet de
# maintenance ou Tor). Pour mettre à jour TOUTE la flotte : tu publies un seul
# manifeste signé sur ton serveur ; chaque borne le récupère à son prochain check.
#
#   ENABLED    1 pour activer, 0 (défaut) pour désactiver.
#   URL        base servant « manifest.json » et « sos-guide.bin » (sans / final).
#   CURL_OPTS  options curl en plus (ex. Tor : --socks5-hostname 127.0.0.1:9050)
#
# Sécurité (rien à configurer) : seul un binaire dont la signature Ed25519
# correspond à la clé de publication épinglée dans l'image
# (/etc/sosguide/release.pub) est installé ; tout retour à une version
# antérieure (downgrade) est refusé ; un échec de santé après mise à jour
# déclenche un rollback automatique vers la version précédente.

ENABLED=0
URL=
CURL_OPTS=
