# ============================================================
#  SOS-GUIDE — Point d'accès WiFi (mode PRODUCTION)
# ============================================================
# La borne diffuse SON PROPRE réseau WiFi OUVERT (aucun mot de
# passe) : les citoyens s'y connectent et le portail s'ouvre seul.
# Ce fichier, à la racine de la carte (partition SOSBOOT), se
# modifie depuis n'importe quel ordinateur, SANS reflasher.
#
#   SSID     = nom du réseau diffusé      (défaut : SOS-GUIDE)
#   COUNTRY  = code pays à 2 lettres pour les canaux légaux
#              (défaut : FR — mettre CH, BE, DE… selon le lieu)
#   CHANNEL  = canal 2,4 GHz 1..13        (défaut : 6)
#
# L'Ethernet (eth0) est un uplink OPTIONNEL : branché, la borne
# télécharge la carte/les MAJ et devient joignable en « sosguide.local ».
# Débranché, la borne fonctionne en autonomie totale (AP seul).
# ------------------------------------------------------------

SSID=SOS-GUIDE
COUNTRY=FR
CHANNEL=6
