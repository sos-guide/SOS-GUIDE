<!doctype html>
<html lang=fr>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Confidentialité — SOS-GUIDE</title>
<link rel=stylesheet href="/lib/sos-theme.css">
<style>
  body{background:var(--bg,#060a12);color:var(--text,#e8eef7);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.65;margin:0}
  .wrap{max-width:760px;margin:0 auto;padding:2rem 1.25rem 4rem}
  .top{display:flex;align-items:center;gap:.6rem;margin-bottom:1.5rem}
  .top a{color:var(--accent,#3b82f6);text-decoration:none;font-size:.9rem}
  .note{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:var(--green,#22c55e);border-radius:12px;padding:.9rem 1.1rem;font-weight:700;margin-bottom:1.5rem}
  #doc h1{font-size:1.5rem;margin:1.4rem 0 .6rem}
  #doc h2{font-size:1.15rem;margin:1.4rem 0 .5rem;color:var(--accent,#3b82f6)}
  #doc h3{font-size:1rem;margin:1rem 0 .4rem}
  #doc p{margin:.5rem 0;color:var(--sub,#94a3b8)}
  #doc li{margin:.3rem 0 .3rem 1.3rem;color:var(--sub,#94a3b8)}
  #doc hr{border:none;border-top:1px solid var(--border,#1e293b);margin:1.4rem 0}
  #doc strong{color:var(--text,#e8eef7)}
</style>
</head>
<body>
<script src="/lib/sos-theme.js"></script>
<div class=wrap>
  <div class=top><a href="/">← Retour à l'accueil</a></div>
  <div class=note>🔒 Aucune donnée personnelle n'est collectée ni conservée par ce nœud.</div>
  <div id=doc>Chargement…</div>
</div>
<script>
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// Rendu markdown minimal (titres, gras, listes, séparateurs) sur du texte échappé.
function render(md){
  const lines = esc(md).split('\n');
  let html='', inList=false;
  const flush=()=>{ if(inList){ html+='</ul>'; inList=false; } };
  for(let raw of lines){
    let l = raw.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    if(/^### /.test(l)){ flush(); html+='<h3>'+l.slice(4)+'</h3>'; }
    else if(/^## /.test(l)){ flush(); html+='<h2>'+l.slice(3)+'</h2>'; }
    else if(/^# /.test(l)){ flush(); html+='<h1>'+l.slice(2)+'</h1>'; }
    else if(/^---+$/.test(l.trim())){ flush(); html+='<hr>'; }
    else if(/^[-*] /.test(l)){ if(!inList){ html+='<ul>'; inList=true; } html+='<li>'+l.slice(2)+'</li>'; }
    else if(l.trim()===''){ flush(); }
    else { flush(); html+='<p>'+l+'</p>'; }
  }
  flush();
  return html;
}
fetch('/PRIVACY.md',{cache:'no-store'})
  .then(r => r.ok ? r.text() : Promise.reject())
  .then(md => { document.getElementById('doc').innerHTML = render(md); })
  .catch(() => { document.getElementById('doc').textContent = 'Politique de confidentialité indisponible hors-ligne.'; });
</script>
</body>
</html>
