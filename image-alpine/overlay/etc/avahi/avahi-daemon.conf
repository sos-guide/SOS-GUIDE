# mDNS SOS-GUIDE — publie « sosguide.local » sur le LAN (uplink Ethernet).
# enable-dbus=no : pas de démon D-Bus sur l'appliance diskless → avahi publie en
# autonome (le cœur mDNS n'a pas besoin de D-Bus).
[server]
host-name=sosguide
domain-name=local
use-ipv4=yes
use-ipv6=no
enable-dbus=no

[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
