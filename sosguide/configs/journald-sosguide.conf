# Journald : logs VOLATILES en RAM (tmpfs), conformité nLPD/RGPD — aucun journal
# persistant sur disque, donc aucune donnée personnelle conservée au redémarrage.
# À installer en /etc/systemd/journald.conf.d/sosguide.conf puis
# `systemctl restart systemd-journald`. Remplace l'intégrité/volatilité de la v2.5.
[Journal]
Storage=volatile
# Borne l'usage RAM des journaux (Pi 2 Go) : on garde l'essentiel récent.
RuntimeMaxUse=32M
