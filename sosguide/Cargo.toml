[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/radio",
    "crates/pay",
    "crates/gateway",
    "crates/storage",
    "crates/network",
    "crates/portal",
    "crates/security",
    "crates/cli",
    "apps/sos-guide",
]
# Le firmware ESP32 (no_std / Embassy) a sa propre toolchain et son propre
# workspace : il ne doit jamais être compilé avec les crates hôte.
exclude = ["firmware/esp32-lora"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
# Crates internes
sos-core = { path = "crates/core" }
sos-radio = { path = "crates/radio" }
sos-pay = { path = "crates/pay" }
sos-gateway = { path = "crates/gateway" }
sos-storage = { path = "crates/storage" }
sos-network = { path = "crates/network" }
sos-portal = { path = "crates/portal" }
sos-security = { path = "crates/security" }
sos-cli = { path = "crates/cli" }

# Runtime async
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "process"] }

# HTTP
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }

# Sérialisation (format de trame LoRa hérité de la v2.5 : JSON compact)
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"

# Cryptographie (identité du nœud + signatures des alertes, interop PEM v2.5)
sha2 = { version = "0.10", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize", "rand_core", "pkcs8", "pem"] }
rand_core = { version = "0.6", default-features = false, features = ["std", "getrandom"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }

# Observabilité
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

# Stockage
redb = "3"

# QR Code (affiche du lieu : rejoindre le WiFi) — port pur Rust, zéro dépendance
qrcodegen = "1.8"

# Erreurs
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# Interdictions de la spécification : toute erreur est propagée via Result.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "warn"

# Profils dictés par la spécification (cible dev : Raspberry Pi 4, 2 Go RAM).
[profile.dev]
opt-level = 1
debug = false
panic = "abort"
incremental = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
